# Render deployment for the Gramini AI backend.
#
# Blueprint deploy: Render → New → Blueprint → point at this repo.
# Everything below is safe to commit. Secrets are marked `sync: false`, which
# means Render prompts for them in the dashboard and never stores them in Git.

services:
  - type: web
    name: gramini-backend
    runtime: python
    plan: free
    region: singapore # closest Render region to India — lowest latency for judges
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    # $PORT is assigned by Render and must be honoured. 0.0.0.0 is required:
    # binding to 127.0.0.1 would make the service unreachable from outside the
    # container, which is the single most common deploy failure.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10" # matches the version developed and tested against

      # ---- SECRETS — entered in the Render dashboard, never committed ----
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_BACKUP
        sync: false

      # ---- Non-secret configuration ----
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TRANSLATE_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MAX_ATTEMPTS
        value: "3"
      - key: GRAMINI_LOG_LEVEL
        value: INFO

      # Set this to the Vercel URL once the frontend is deployed, then redeploy.
      # Comma-separated if you need more than one origin.
      - key: FRONTEND_URL
        sync: false

      # Optional: allows every Vercel preview build for this project.
      # Example: ^https://gramini-ai-.*\.vercel\.app$
      - key: FRONTEND_URL_REGEX
        sync: false
